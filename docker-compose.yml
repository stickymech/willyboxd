version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - apps/server/.env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    env_file:
      - apps/client/.env
    ports:
      - "5173:80"
    restart: unless-stopped
