services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
