schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Monorepo: Turborepo + npm workspaces
    - apps/client: Vite + React + Tailwind CSS
    - apps/server: Hono + SQLite (better-sqlite3)
    - packages/shared: types, Zod schemas, constants
  Language: TypeScript strict
  UI conventions: single fixed Linear palette via semantic CSS tokens in `:root` (no runtime theme switching); `.btn-primary`/`.btn-secondary` component classes
  Repo: https://github.com/stickymech/willyboxd
  Quality: `npm run lint && npm run typecheck && npm run test && npm run build` all green locally
  Hobby project - YAGNI, standard tdd/git/publish model, no over-engineered CI

